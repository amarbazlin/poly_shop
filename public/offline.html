<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForgeraAI — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      background: rgba(249, 115, 22, 0.12);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 36px;
      height: 36px;
      stroke: #f97316;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f97316;
    }
    .brand-text {
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2a14 14 0 0 0-7 2.5A14 14 0 0 0 12 22a14 14 0 0 0 7-2.5A14 14 0 0 0 12 2z" />
        <path d="M12 8v4" />
        <path d="M12 16h.01" />
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>Please reconnect to the internet to continue using ForgeraAI. Your data will be waiting for you.</p>
    <button onclick="window.location.reload()" style="
      background: #f97316;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: opacity 0.15s;
    " onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
      Try Again
    </button>
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-text">ForgeraAI</span>
    </div>
  </div>
</body>
</html>
